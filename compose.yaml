# Deployment for lutron_qs_exporter.
#
# The image tag must match the version field in pyproject.toml.
# Processor settings are the environment block below. There is no config file.
#
# Exporter only (you already run Prometheus and Grafana):
#   docker compose up -d
#
# Exporter plus the sample Prometheus and Grafana stack:
#   docker compose --profile monitoring up -d

name: lutron-qs-exporter

services:
  lutron-qs-exporter:
    image: monster-jj.jvj28.com:9092/lutron_qs_exporter:1.3.0
    container_name: lutron-qs-exporter
    restart: unless-stopped
    pull_policy: always
    ports:
      - "9992:9992"
    environment:
      LUTRON_ADDRESS: "192.168.1.40"
      LUTRON_PORT: "23"
      LUTRON_USERNAME: "default"
      LUTRON_PASSWORD: "default"
      LOG_LEVEL: "INFO"

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    container_name: lutron-qs-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.4.0
    container_name: lutron-qs-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      # Host 3000 is already taken on the dev machine by another app.
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/lutron-overview.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
