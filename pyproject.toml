[project]
name = "lutron_qs_exporter"
version = "1.3.0"
description = "Prometheus exporter for Lutron QS systems"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
authors = [
    {name = "James Barwick", email = "jbarwick@me.com"}
]
dependencies = [
    "fastapi>=0.111.0,<1",
    "prometheus-client>=0.20.0,<1",
    "requests>=2.31.0,<3",
    "uvicorn>=0.30.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.1",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lutron_qs_exporter*"]
